<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرهنگ رنگ‌های فارسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1b18;--mu:#655f56;--bd:#e2ddd2;--ac:#0f6b5c;--on:#fff;--sh:0 1px 2px rgba(30,25,15,.06),0 10px 26px -14px rgba(30,25,15,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13120f;--sf:#1e1c18;--tx:#f1eee7;--mu:#a9a296;--bd:#332f28;--ac:#3cc4a8;--on:#06231d;--sh:0 10px 30px -14px #000}}
:root[data-theme="dark"]{--bg:#13120f;--sf:#1e1c18;--tx:#f1eee7;--mu:#a9a296;--bd:#332f28;--ac:#3cc4a8;--on:#06231d;--sh:0 10px 30px -14px #000}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:0 16px 48px}
header.top{position:static;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,4vw,28px);font-weight:800;letter-spacing:-.3px}
h1 small{font-weight:400;color:var(--mu);font-size:.5em;margin-inline-start:8px}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;transition:.18s}
.ib:hover{border-color:var(--ac)}
.ib[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.srch{position:relative;flex:1 1 240px}
.srch svg{position:absolute;inset-inline-start:12px;top:11px;color:var(--mu)}
.srch input{width:100%;min-height:40px;padding:0 40px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{position:absolute;inset-inline-end:6px;top:4px;width:32px;height:32px;display:none;align-items:center;justify-content:center;border:0;background:none;color:var(--mu);border-radius:8px}
.srch .clr.on{display:flex}
.srch .clr:hover{background:var(--bd)}
.totop{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:20}
.totop.on{opacity:1;pointer-events:auto;transform:none}
#tagf{min-height:40px;padding:0 10px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tgc{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--bd);font-size:12px}
.tgc button{border:0;background:none;padding:0;color:var(--mu);font-size:14px;line-height:1}
.tgi{display:flex;gap:6px;margin-top:8px}
.tgi input{flex:1;min-height:36px;padding:0 12px;border:1px solid var(--bd);background:var(--bg);border-radius:10px}
.eyew{position:relative;display:inline-block;max-width:100%;line-height:0}
.eyew canvas{max-width:100%;height:auto;border-radius:12px;cursor:crosshair;touch-action:none;display:block}
.lens{position:absolute;width:96px;height:96px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);pointer-events:none;display:none;image-rendering:pixelated}
.lens.on{display:block}
.eyeres{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.eyeres i{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd)}
.pr{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;transition:background .35s,color .35s}
.pr.on{display:flex}
.pr .pt{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;flex-wrap:wrap}
.pr .pt .sp{flex:1}
.pr .pb{min-height:40px;padding:0 14px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:12px;opacity:.85}
.pr .pb:hover,.pr .pb[aria-pressed="true"]{opacity:1;background:rgba(127,127,127,.25)}
.pr .pm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 60px;gap:6px;min-height:0}
.pr .pn{font-size:clamp(40px,10vw,120px);font-weight:800;line-height:1.15;letter-spacing:-1px}
.pr .pe{font-size:clamp(18px,3.5vw,36px);opacity:.85;direction:ltr}
.pr .pc{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;direction:ltr}
.pr .pc button{min-height:44px;padding:0 16px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:12px;font:600 15px ui-monospace,Menlo,monospace;opacity:.9}
.pr .pc button:hover{background:rgba(127,127,127,.25)}
.pr .pv{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid currentColor;background:transparent;color:inherit;opacity:.6;font-size:22px}
.pr .pv:hover{opacity:1}
.pr .pv.l{left:12px}.pr .pv.r{right:12px}
.pr .pa{flex:1;display:flex;min-height:0}
.pr .pa button{flex:1;border:0;padding:0;display:flex;align-items:flex-end;justify-content:center;font:600 12px Vazirmatn,Tahoma,sans-serif;padding-bottom:16px;writing-mode:vertical-rl;text-orientation:mixed}
.pr .pa button[aria-current="true"]{flex:2.2}
.pr .pf{padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;opacity:.75}
.stbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.stbar b{width:90px;font-size:12px;flex:none;text-align:left}
.stbar .tr{flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden}
.stbar .fl{height:100%;border-radius:8px}
.stbar span{width:34px;flex:none;font-size:11px;color:var(--mu);text-align:left}
.nd2{display:inline-block;width:7px;height:7px;border-radius:2px;background:#c9902e;margin-inline-start:4px;vertical-align:middle}
select{min-height:40px;padding:0 10px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
.finder{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:1px dashed var(--bd);border-radius:12px;background:var(--sf)}
.finder input{width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.finder button{border:0;background:none;padding:0;font-weight:600;text-decoration:underline dotted;text-underline-offset:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:36px;padding:0 13px;border:1px solid var(--bd);background:var(--sf);border-radius:99px;transition:.18s}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chip b{font-weight:400;color:var(--mu);font-size:12px}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px;color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.card{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);overflow:hidden;transition:transform .2s,box-shadow .2s;animation:in .35s both}
.card:hover{transform:translateY(-3px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.open{display:block;width:100%;padding:0;border:0;background:none;text-align:start}
.sw{height:104px;display:flex;align-items:flex-end;padding:10px 12px;font:600 12px ui-monospace,Menlo,monospace;direction:ltr}
.meta{padding:10px 12px 12px}
.nm{font-weight:800;font-size:16px}
.fm{font-size:12px;color:var(--mu)}
.cp,.fv{position:absolute;top:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:0;background:rgba(255,255,255,.85);color:#111;opacity:0;transition:.18s}
.cp{inset-inline-start:8px}.fv{inset-inline-end:8px}
.card:hover .cp,.card:hover .fv,.cp:focus-visible,.fv:focus-visible,.fv[aria-pressed="true"]{opacity:1}
.fv[aria-pressed="true"] svg{fill:#e0245e;stroke:#e0245e}
@media(hover:none){.cp,.fv{opacity:1}}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--mu)}
dialog{width:min(92vw,460px);padding:0;border:1px solid var(--bd);border-radius:22px;background:var(--sf);color:var(--tx);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,8,.55);backdrop-filter:blur(3px)}
.dsw{height:150px;display:flex;justify-content:space-between;align-items:flex-start;padding:14px}
.dsw button{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;border:0;background:rgba(255,255,255,.85);color:#111}
.dsw button[aria-pressed="true"] svg{fill:#e0245e;stroke:#e0245e}
.db{padding:16px 18px 20px}
.db h2{margin:0;font-size:24px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;width:100%;background:none;text-align:start;transition:.18s}
.row:hover{border-color:var(--ac)}
.row span{font-weight:600;color:var(--mu);width:44px;font-size:12px}
.row code{flex:1;direction:ltr;text-align:left;font:500 14px ui-monospace,Menlo,monospace}
.ct{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;font-size:13px}
.ct div{flex:1 1 130px;padding:8px 10px;border-radius:12px;font-weight:600}
.rel{display:flex;gap:8px;margin-top:12px}
.rel button{flex:1;border:1px solid var(--bd);background:none;border-radius:12px;padding:0;overflow:hidden;font-size:12px}
.rel i{display:block;height:34px}.rel em{display:block;padding:4px 2px;font-style:normal}
.ex{display:none;gap:8px;align-items:center;margin:12px 0 0;padding:10px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--bd)}
.ex.on{display:flex;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:none}
.xb{display:none}
.grid.ls{grid-template-columns:1fr;gap:10px}
.ls .card{display:flex;align-items:center;gap:8px;padding-inline-end:8px}
.ls .card:hover{transform:none}
.ls .open{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.ls .sw{width:96px;height:64px;flex:none;align-items:center;justify-content:center}
.ls .meta{padding:6px 0;flex:1}
.ls .xb{display:flex;gap:6px}
.mini{min-height:32px;padding:0 10px;border:1px solid var(--bd);background:none;border-radius:9px;font:500 12px ui-monospace,Menlo,monospace;direction:ltr;transition:.18s}
.mini:hover{border-color:var(--ac)}
.ls .cp,.ls .fv{position:static;opacity:1;background:var(--bd);color:var(--tx);flex:none}
@media(max-width:760px){.ls .xb{display:none}}
.tw{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:12px}
.tw button{border:0;border-radius:6px;height:44px;font:600 9px ui-monospace,monospace;padding:0}
.twb{display:flex;gap:8px;margin-top:8px}.twb button{flex:1;justify-content:center}
.ir{display:none;margin-top:14px;padding:12px;border:1px solid var(--bd);border-radius:16px;background:var(--sf)}
.ir.on{display:block}
.ir .rw{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ir img{height:72px;max-width:120px;object-fit:cover;border-radius:12px}
.ir .sl{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.ir .sl button{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:none;padding:0;min-width:88px;font-size:12px}
.ir .sl i{display:block;height:40px}.ir .sl em{display:block;padding:3px 6px;font-style:normal}
.hl{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--mu)}
.hl select{min-height:34px}
.cb{display:flex;gap:8px;margin-top:6px;font-size:11px}
.cb div{flex:1;text-align:center}
.cb i{display:block;height:30px;border-radius:8px;border:1px solid var(--bd)}
.ir input,.ir select{min-height:38px;padding:0 10px;border:1px solid var(--bd);background:var(--bg);border-radius:10px;min-width:0}
.ge{display:flex;align-items:center;gap:6px}
.ge input[type=color]{width:40px;padding:2px;cursor:pointer}
.ge input:not([type=color]){width:138px}
.ge span{font-size:12px;color:var(--mu)}
.pv{margin-top:10px;padding:18px;border-radius:14px;border:1px solid var(--bd)}
.qz{text-align:center}
.qz .qsw{height:100px;border-radius:16px;margin:10px 0}
.qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:10px auto 0}
.qz .opts button{min-height:44px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
.qz .opts button.ok{background:#1ea85a;color:#fff;border-color:#1ea85a}
.qz .opts button.no{background:#d32f2f;color:#fff;border-color:#d32f2f}
.qz .sc{font-weight:800;margin-top:8px}
.mx{display:grid;gap:2px;margin-top:10px;border-radius:12px;overflow:hidden}
.mx button{border:0;min-height:46px;font:600 12px ui-monospace,monospace;padding:2px}
.mxtb{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.mxtb td,.mxtb th{padding:6px;text-align:center;border:1px solid var(--bd)}
.mxtb th{background:var(--bg)}
.kh{width:min(92vw,420px);padding:0;border:1px solid var(--bd);border-radius:20px;background:var(--sf);color:var(--tx)}
.kh::backdrop{background:rgba(10,10,8,.5)}
.kh .kb{padding:16px 18px}
.kh h2{margin:0 0 10px;font-size:18px}
.kh .kr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}
.kh .kr:first-of-type{border-top:0}
.kh kbd{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font:600 12px ui-monospace,monospace}
.dpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:10px}
.dpg button{border:0;border-radius:12px;padding:14px 10px;text-align:right;min-height:76px}
.nd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-inline-start:5px;vertical-align:middle}
.ntx{width:100%;min-height:60px;margin-top:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);resize:vertical;font:inherit}
.nsv{font-size:11px;color:var(--mu);margin-top:4px;min-height:14px}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.grid.dense .sw{height:64px}
.grid.large{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.grid.large .sw{height:140px}
#dens{min-height:40px;padding:0 10px;border:1px solid var(--bd);background:var(--sf);border-radius:12px}
.dym{grid-column:1/-1;text-align:center;padding:20px 0;color:var(--mu)}
.dym .sl{justify-content:center;margin-top:10px}
/* ===== redesign: app shell ===== */
:root{--acs:rgba(15,107,92,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--acs:rgba(60,196,168,.15)}}
:root[data-theme="dark"]{--acs:rgba(60,196,168,.15)}
header.top{padding:20px 0 6px;border:0;background:none}
.app{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;border-radius:15px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh)}
.logo i{border-radius:6px;display:block}
.bt{min-width:0}
h1{margin:0;font-size:clamp(19px,3.4vw,26px);font-weight:800;letter-spacing:-.3px;line-height:1.3}
.sub{color:var(--mu);font-size:13px;line-height:1.4}
.ib.sq{width:42px;padding:0;justify-content:center;font-weight:700}
.ib.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.ib.pri:hover{filter:brightness(1.08);border-color:var(--ac)}
.ib.pri[aria-expanded="true"]{box-shadow:0 0 0 4px var(--acs)}
.ib.big{min-height:54px;padding:0 20px;border-radius:16px}
.ib[aria-expanded="true"]:not(.pri){border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.bdg{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.bdg[hidden]{display:none}
.ib[aria-pressed="true"] .bdg{background:rgba(255,255,255,.22);color:inherit}
.spec{height:4px;border-radius:99px;margin-top:16px;opacity:.9;background:linear-gradient(to left,#E10600,#FF8A00,#FFD800,#1EA85A,#30D5C8,#0074D9,#7D3CC8,#FF9DB5)}
.find{position:relative;display:flex;gap:10px;align-items:stretch;margin-top:16px}
.srch{flex:1;min-width:0}
.srch svg{top:18px;inset-inline-start:16px}
.srch input{min-height:54px;padding:0 48px;border-radius:16px;font-size:16px;box-shadow:var(--sh);transition:.18s}
.srch input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.srch .clr{top:11px;inset-inline-end:10px}
.kbh{position:absolute;inset-inline-end:14px;top:16px;min-width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:7px;color:var(--mu);font:600 12px ui-monospace,Menlo,monospace;background:var(--bg);pointer-events:none}
.srch input:not(:placeholder-shown)~.kbh,.srch input:focus~.kbh{display:none}
.pop{display:none;position:absolute;top:calc(100% + 10px);inset-inline:0;z-index:30;padding:18px;border:1px solid var(--bd);border-radius:22px;background:var(--sf);box-shadow:0 30px 70px -26px rgba(0,0,0,.4);grid-template-columns:repeat(4,1fr);gap:18px;animation:pin .18s both}
.pop.on{display:grid}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}}
.pg h3{margin:0 0 6px;padding:0 10px;font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.2px}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:none;border-radius:14px;text-align:start;transition:.15s}
.tile:hover,.tile:focus-visible{background:var(--acs)}
.ti{width:38px;height:38px;flex:none;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.tile b{display:block;font-size:14px;line-height:1.5}
.tile small{display:block;color:var(--mu);font-size:12px;line-height:1.5}
.finder{flex-wrap:wrap;gap:8px 10px;padding:9px 10px;border:1px dashed var(--bd);border-radius:14px;margin-top:2px}
.finder input{width:38px;height:38px;border-radius:12px;flex:none}
.finder span{flex:1;min-width:0}
.finder b{display:block;font-size:14px;line-height:1.5}
.finder small{display:block;color:var(--mu);font-size:12px;line-height:1.5}
.finder button{width:100%;text-align:start;padding:2px 0}
.tray{display:none;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;padding:14px;border:1px solid var(--bd);background:var(--sf);border-radius:18px}
.tray.on{display:flex}
.fld{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;font-size:12px;color:var(--mu)}

.bar{margin:18px 0 2px;gap:8px}

.menuwrap{position:relative}
.menu{display:none;position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:25;min-width:230px;padding:6px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);box-shadow:0 24px 50px -22px rgba(0,0,0,.4)}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;background:none;border-radius:11px;text-align:start;transition:.15s}
.menu button:hover,.menu button:focus-visible{background:var(--acs)}
.menu svg{color:var(--ac)}
.card{border-radius:20px}
.card:hover{box-shadow:0 18px 40px -18px rgba(30,25,15,.35)}
.open:focus-visible{outline-offset:-3px;border-radius:20px}
.sw{height:112px}

.scrim{display:none;position:fixed;inset:0;z-index:40;background:rgba(10,10,8,.45);backdrop-filter:blur(2px)}
.scrim.on{display:block}
.drawer{display:none;position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:45;width:min(460px,100vw);flex-direction:column;background:var(--sf);border-inline-start:1px solid var(--bd);box-shadow:24px 0 60px -30px rgba(0,0,0,.45);animation:drin .22s both}
.drawer.on{display:flex}
@keyframes drin{from{opacity:0;transform:translateX(-24px)}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--bd)}
.dh b{font-size:17px;font-weight:800}
.dbody{flex:1;overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.drawer .ir{margin:0;padding:0;border:0;background:none;border-radius:0}
.drawer .ge input:not([type=color]){width:120px}

 const A=epx('cxa'),B=epx('cxb');
 if(!A||!B){$('#co').textContent='نام رنگ را از فهرست پیشنهادی انتخاب کنید یا با انتخابگر رنگ، رنگ دلخواه بسازید.';return}
 const r=cr(A,B),lv=r>=7?'AAA (عالی)':r>=4.5?'AA (خوب)':r>=3?'فقط برای متن درشت':'ناکافی',rm=(A.r+B.r)/2,dr=A.r-B.r,dg=A.g-B.g,db=A.b-B.b,pc=Math.round(Math.sqrt((2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db)/765*100);
 $('#co').innerHTML=`<div class="pv" style="background:${B.hx};color:${A.hx}"><div style="font-size:22px;font-weight:800">${A.n} روی ${B.n}</div><div>نمونه‌ی متن کوچک برای بررسی خوانایی: بهار آمد و گل‌ها شکفتند.</div></div><div class="rw"><span>نسبت کنتراست: <b>${fa(r.toFixed(1))} به ۱</b> · ${lv}</span><span>اختلاف رنگی: <b>${fa(pc)}٪</b></span></div><div class="rw"><button class="ib" data-o="${A.nn}">نزدیک‌ترین نام متن: ${A.nn}</button><button class="ib" data-o="${B.nn}">نزدیک‌ترین نام پس‌زمینه: ${B.nn}</button></div>`;
}

 const g=$('#mx');
 if(!g.dataset.b){g.dataset.b=1;
  g.innerHTML=`<b>مقایسه‌ی همزمان چند رنگ</b><div class="rw"><input id="mxi" list="nl" placeholder="نام رنگ را وارد و اضافه کنید" aria-label="افزودن رنگ"><button class="ib" data-madd>افزودن</button><button class="ib" data-mfav>افزودن علاقه‌مندی‌ها</button><button class="ib" data-mclr>پاک‌کردن</button></div><div id="mxbar" class="mx"></div><div id="mxg"></div>`}

let mxN=[];try{mxN=JSON.parse(sessionStorage.getItem('mxN')||'null')||[]}catch(e){}
function renderMix(){
 try{sessionStorage.setItem('mxN',JSON.stringify(mxN))}catch(e){}
 const cs=mxN.map(by).filter(Boolean);
 $('#mxbar').style.gridTemplateColumns=`repeat(${Math.max(cs.length,1)},1fr)`;
 $('#mxbar').innerHTML=cs.map(c=>`<button data-mrm="${c.n}" style="background:${c.hx};color:${fg(c)}">${c.n} ✕</button>`).join('')||'<span style="grid-column:1/-1;color:var(--mu);padding:14px">رنگی اضافه نشده — چند نام رنگ وارد کنید تا کنتراست دوبه‌دوشان مقایسه شود.</span>';
 if(cs.length<2){$('#mxg').innerHTML='';return}
 $('#mxg').innerHTML=`<table class="mxtb"><tr><th></th>${cs.map(c=>`<th>${c.n}</th>`).join('')}</tr>${cs.map(a=>`<tr><th>${a.n}</th>${cs.map(b=>a===b?'<td>—</td>':`<td style="background:${b.hx};color:${a.hx}">${fa(cr(a,b).toFixed(1))}</td>`).join('')}</tr>`).join('')}</table><div class="fm" style="margin-top:6px">هر خانه، رنگ ردیف روی رنگ ستون است؛ عدد، نسبت کنتراست است (بالای ۴.۵ برای متن مناسب است).</div>`;

let qs=0,qt=0,qc=null,qbusy=false;
function qgen(){
 qbusy=false;const pool=list().length>=4?list():D;
 qc=pool[Math.random()*pool.length|0];
 const opts=new Set([qc.n]);while(opts.size<4)opts.add(pool[Math.random()*pool.length|0].n);
 const arr=[...opts].sort(()=>Math.random()-.5);
 $('#qz').innerHTML=`<b>این رنگ چه نامی دارد؟</b><div class="qsw" style="background:${qc.hx}"></div><div class="opts">${arr.map(n=>`<button data-qa="${n}">${n}</button>`).join('')}</div><div class="sc">امتیاز: ${fa(qs)} از ${fa(qt)}</div>`;
}
function qanswer(n,btn){
 if(qbusy)return;qbusy=true;qt++;const ok=n===qc.n;if(ok)qs++;
 [...$('#qz').querySelectorAll('.opts button')].forEach(b=>{if(b.dataset.qa===qc.n)b.classList.add('ok');else if(b===btn&&!ok)b.classList.add('no');b.disabled=true});
 $('#qz .sc').textContent=`امتیاز: ${fa(qs)} از ${fa(qt)}`+(ok?' · درست!':' · نام درست: '+qc.n);
 setTimeout(qgen,1100);
}

/* ===== redesign glue: popover, filter tray, export menu, drawer ===== */
const POP=$('#pop'),TB=$('#toolsBtn'),SCR=$('#scrim'),DR=$('#drawer'),TRAY=$('#tray'),FB=$('#fltBtn'),EXM=$('#exMenu'),EXB=$('#exBtn');
const mobile=()=>window.matchMedia('(max-width:720px)').matches;
function syncScrim(){SCR.classList.toggle('on',mobile()&&(POP.classList.contains('on')||DR.classList.contains('on')))}
function popSet(v){POP.classList.toggle('on',v);TB.setAttribute('aria-expanded',v);syncScrim()}
function menuSet(v){EXM.classList.toggle('on',v);EXB.setAttribute('aria-expanded',v)}
TB.onclick=e=>{e.stopPropagation();menuSet(false);popSet(!POP.classList.contains('on'))};
EXB.onclick=e=>{e.stopPropagation();popSet(false);menuSet(!EXM.classList.contains('on'))};
FB.onclick=()=>{const v=!TRAY.classList.contains('on');TRAY.classList.toggle('on',v);FB.setAttribute('aria-expanded',v)};
document.addEventListener('click',e=>{
 if(POP.classList.contains('on')&&(e.target.closest('.tile,#fres')||!e.target.closest('#pop,#toolsBtn')))popSet(false);
 if(EXM.classList.contains('on')&&(e.target.closest('#exMenu button')||!e.target.closest('#exMenu,#exBtn')))menuSet(false);
});
SCR.onclick=()=>{popSet(false);closeDrawer()};
function closeDrawer(){DR.querySelectorAll('.ir').forEach(x=>x.classList.remove('on'))}
$('#dclose').onclick=closeDrawer;
window.addEventListener('keydown',e=>{
 if(e.key!=='Escape'||$('#pr').classList.contains('on')||$('#dlg').open||$('#kh').open)return;
 if(POP.classList.contains('on'))popSet(false);
 else if(EXM.classList.contains('on'))menuSet(false);
 else if(DR.classList.contains('on'))closeDrawer();
});
const DTITLES={st:'آمار فهرست',dp:'پالت طراحی',mx:'مقایسه‌ی چندتایی',qz:'بازی حدس رنگ',pl:'پالت‌های من',cm:'مقایسه‌ی دو رنگ',gr:'ساخت گرادیان',ir:'رنگ از تصویر'};
const DSECS=[...DR.querySelectorAll('.ir')];
new MutationObserver(ms=>{
 const opened=ms.map(m=>m.target).filter(t=>DSECS.includes(t)&&t.classList.contains('on')).pop();
 if(opened)DSECS.forEach(x=>{if(x!==opened)x.classList.remove('on')});
 const cur=DSECS.find(x=>x.classList.contains('on'));
 DR.classList.toggle('on',!!cur);document.body.classList.toggle('has-drawer',!!cur);
 $('#dtitle').textContent=cur?DTITLES[cur.id]||'':'';
 syncScrim();
}).observe(DR,{subtree:true,attributes:true,attributeFilter:['class']});

};

updFlt();
