<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KarixApp | داشبورد</title>
<style>
  body { font-family: Tahoma, sans-serif; background:#f4f6fb; color:#222;
         min-height:100vh; display:grid; place-items:center; margin:0; }
  .wrap { text-align:center; padding:24px; }
  h1 { font-size:2rem; margin-bottom:6px; }
  .sub { color:#777; margin-bottom:32px; }
  .grid { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .card { width:230px; background:#fff; border:1px solid #e5e7ef; border-radius:14px;
          padding:20px; text-decoration:none; color:#222; transition:.2s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,.08); }
  .emoji { font-size:2rem; }
  .card h2 { font-size:1.05rem; margin:10px 0 4px; }
  .card span { color:#8a8fa3; font-size:.85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🧩 KarixApp</h1>
    <p class="sub">داشبورد برنامه‌های من</p>
    <div class="grid">
      <a class="card" href="/persian-colors/">
        <div class="emoji">🎨</div>
        <h2>رنگ‌های ایرانی</h2>
        <span>پالت رنگ‌های سنتی ایران</span>
      </a>
      <!-- برنامه بعدی رو اینجا اضافه کن -->
    </div>
  </div>
</body>
</html>
